<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Charmed — Avant que la vision s’accomplisse</title><link rel="stylesheet" href="/modules/charmed.css?v=selecteur-2"><link rel="stylesheet" href="/modules/charmed-skin.css?v=regles-reaction-2"></head>
<body><div class="book-corners" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<header class="masthead"><div class="brand"><span id="game-title">Avant que la vision s’accomplisse</span><label class="scenario-picker">Partie <select id="scenario-select" aria-label="Choisir la partie"></select></label></div><div class="charmed-logo" role="img" aria-label="Charmed"></div><span id="phase" hidden></span></header>
<div id="notice" role="status" aria-live="polite"></div>
<div class="layout">
<aside class="broadcast">
<section class="radio-section"><h2 class="illuminated"><span class="initial">L</span>es Fondateurs</h2><p class="morning-label">Le message du matin</p><div id="radio"></div></section>
<section class="calendar-section"><h2 class="illuminated"><span class="initial">C</span>alendrier<br><span class="subtitle">de la partie</span></h2><p class="calendar-note"><span id="day"></span> · sélectionne un jour.</p><div id="calendar"></div></section>

</aside>
<main>
<div id="board" aria-label="Plateau des deux camps"></div>


</main><aside class="judgement"><section class="turn-panel"><h2 class="illuminated"><span class="initial">L</span>e tour</h2><div id="turn-copy"></div><section class="playbar"><div><strong id="budget"></strong><p id="hint">Glissez une ressource sur sa cible, puis expliquez son rôle.</p></div><button id="end" type="button">Terminer mon passage</button><button id="resume" type="button" hidden>Reprendre la séquence</button></section></section><section class="arbiter-page"><h2 class="illuminated"><span class="initial">L</span>’Ange<br><span class="subtitle">du destin</span></h2><div id="arbitration"></div><div class="triquetra" aria-hidden="true"><svg viewBox="0 0 120 112"><defs><linearGradient id="knot-gold" x2=".8" y2="1"><stop stop-color="#f4d582"/><stop offset=".5" stop-color="#b28032"/><stop offset="1" stop-color="#e6bc61"/></linearGradient></defs><path class="knot-shadow" d="M60 8C25 37 27 72 60 79C93 72 95 37 60 8Z M14 94C57 109 86 87 75 53C53 27 21 43 14 94Z M106 94C99 43 67 27 45 53C34 87 63 109 106 94Z"/><path class="knot-gold" d="M60 8C25 37 27 72 60 79C93 72 95 37 60 8Z M14 94C57 109 86 87 75 53C53 27 21 43 14 94Z M106 94C99 43 67 27 45 53C34 87 63 109 106 94Z"/></svg></div></section>

</aside></div>
<dialog id="composer" class="composer"><button id="close-composer" type="button" class="close" aria-label="Fermer la proposition">×</button><h2 id="composer-title">Votre proposition</h2><p id="composer-context"></p>
<div id="receipt" hidden aria-live="polite"></div>
<form id="action-form">
<label id="effect-label">Cette ressource sert de<select id="effect-kind"><option value="key">Clé — rendre un état vrai ou lever un verrou</option><option value="lock">Verrou — empêcher un effet précis</option></select></label>
<section id="writing-help" class="writing-help" hidden aria-label="Aide à la rédaction"><strong id="writing-help-title"></strong><ol id="writing-questions"></ol><p id="writing-reminder"></p></section>
<label id="text-label">Qui ou quoi, comment et dans quel but ?<textarea id="proposal" aria-describedby="writing-help cost" rows="5" maxlength="3000" required minlength="8" placeholder="Décris précisément ton action et l’effet recherché…"></textarea></label>
<p class="cost" id="cost"></p><button type="submit" id="submit">Soumettre à l’Ange du destin</button>
</form></dialog>
<dialog id="detail"><button id="close-detail" class="close" aria-label="Fermer le détail">×</button><h2 id="detail-title"></h2><p id="detail-text"></p><div id="card-actions"></div></dialog>
<script src="/modules/charmed.js?v=selecteur-1"></script>
</body></html>
